[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionbot"
version = "0.1.0"
description = "A Discord bot that runs timed auctions with anti-sniping."
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3",
    "aiosqlite",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auctionbot = ["storage/schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
